[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "industry-research-platform"
version = "0.1.0"
description = "Durable research service framework with a pluggable crawler adapter"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "filelock>=3.16,<4",
  "httpx>=0.27,<1", "celery[redis]>=5.5,<6",
  "numpy==2.2.6", "onnxruntime==1.23.2", "tokenizers==0.22.2",
  "scikit-learn==1.7.2", "xgboost==3.1.1; platform_system == 'Windows'",
  "xgboost-cpu==3.1.1; platform_system != 'Windows'",
  "curl_cffi>=0.13,<1", "patchright>=1.55,<2",
  "pandas==2.3.3", "matplotlib==3.10.8", "pyampute==0.0.3", "psutil==7.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "httpx2>=2.15,<3", "ruff>=0.9,<1"]

[project.scripts]
industry = "app.cli:main"
industry-research = "app.pipeline_cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "industry-research-advisor"
version = "0.1.0"
description = "Standalone industry research advice module; no crawler or web service required"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "pydantic-settings>=2.6,<3", "filelock>=3.16,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
research-advisor = "advisor_bot.cli:main"

[tool.setuptools.packages.find]
include = ["advisor_bot*"]

[tool.setuptools.package-data]
advisor_bot = ["assets/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

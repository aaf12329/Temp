# Optional PostgreSQL infrastructure; Docker is not installed by this project.
# Set POSTGRES_PASSWORD in the root .env before running docker compose up -d.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: industry
      POSTGRES_USER: industry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U industry -d industry"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
